[package]
name = "whatsgoingon"
version = "0.1.0"
edition = "2024"
description = "WhatsGoingOn (wgo) — A sleek Windows monitor for all running terminal, cmd, shell, and dev server instances"
default-run = "wgo"

[[bin]]
name = "wgo"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = true }
egui = "0.31"
sysinfo = "0.33"
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_ProcessStatus",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
